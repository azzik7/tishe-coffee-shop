<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Заказы · тише</title>
  <meta name="theme-color" content="#100d0c">
  <style>
    :root{color-scheme:dark;--bg:#100d0c;--panel:#1c1714;--text:#f4eee8;--muted:#b8aba3;--accent:#f0b878;--line:rgba(244,238,232,.14);--danger:#ffb3a7}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit;touch-action:manipulation}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:calc(14px + env(safe-area-inset-top)) max(20px,4vw) 14px;border-bottom:1px solid var(--line);background:rgba(16,13,12,.92);backdrop-filter:blur(14px)}.brand{color:var(--accent);font-size:20px;font-weight:800;text-decoration:none}.header-actions{display:flex;gap:10px}.ghost{min-height:44px;padding:0 14px;color:var(--text);border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;transition:background-color 180ms ease,transform 150ms ease}.ghost:active,.btn:active{transform:scale(.97)}main{width:min(1300px,calc(100% - 40px));margin:50px auto 90px}.top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px}h1{margin:0;font-family:Georgia,serif;font-size:clamp(38px,7vw,76px);font-weight:400;line-height:1;letter-spacing:-.055em}.muted{color:var(--muted)}.login{width:min(480px,100%);margin:12vh auto;padding:32px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.login h1{font-size:48px}.field{display:grid;gap:7px;margin-top:16px}.field input{min-height:48px;padding:0 13px;color:var(--text);border:1px solid var(--line);border-radius:10px;background:#171311}.btn{min-height:48px;margin-top:20px;padding:0 20px;color:#21160f;border:0;border-radius:999px;background:var(--accent);font-weight:700;cursor:pointer;transition:transform 150ms ease}.status{min-height:22px;color:var(--danger)}.orders{display:grid;gap:14px}.order{display:grid;grid-template-columns:1.1fr .9fr .7fr auto;gap:22px;align-items:start;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.order h2{margin:0;font-size:20px}.order p{margin:6px 0 0}.items{color:var(--muted)}.money{font-size:20px;font-weight:700}.status-select{min-height:44px;padding:0 10px;color:var(--text);border:1px solid var(--line);border-radius:9px;background:#171311}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:99px;background:rgba(240,184,120,.12);color:var(--accent);font-size:12px}.empty{padding:40px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}[hidden]{display:none!important}@media(max-width:850px){.order{grid-template-columns:1fr}.top{display:grid}}@media(max-width:620px){header{padding-inline:14px}.header-actions{gap:6px}.ghost{padding-inline:11px}main{width:calc(100% - 28px);margin:28px auto 60px}.login{margin:6vh auto;padding:24px 18px}.login h1{font-size:46px}.field input{min-height:52px;font-size:16px}.btn{width:100%;min-height:52px}.top{gap:8px}.order{padding:18px}.status-select{width:100%;min-height:50px;font-size:16px}}@media(prefers-reduced-motion:no-preference){.login,.order{animation:enter .36s cubic-bezier(.23,1,.32,1) both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">тише</a><div class="header-actions"><button class="ghost" id="refreshButton" type="button">Обновить</button><button class="ghost" id="logoutButton" type="button">Выйти</button></div></header>
  <main>
    <section class="login" id="loginPanel">
      <p class="muted">Для сотрудников</p><h1>Вход</h1>
      <form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required></div><button class="btn" type="submit">Открыть заказы</button><p class="status" id="loginStatus" role="status"></p></form>
    </section>
    <section id="dashboard" hidden>
      <div class="top"><div><p class="muted">Панель кофейни</p><h1>Заказы</h1></div><p class="muted" id="orderCount"></p></div>
      <div class="orders" id="orders"></div>
    </section>
  </main>
  <script>
    (()=>{
      const $=s=>document.querySelector(s);const money=new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:0});const labels={new:"Новый",confirmed:"Подтверждён",accepted:"Принят",preparing:"Готовится",ready:"Готов",completed:"Выполнен",cancelled:"Отменён",expired:"Резерв истёк"};
      const escape=value=>String(value).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
      async function request(url,options={}){const response=await fetch(url,{credentials:"same-origin",...options,headers:options.body?{"Content-Type":"application/json"}:undefined});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Ошибка сервера.");return data}
      async function check(){try{const {user}=await request("/api/auth/me");if(!user||user.role!=="admin")throw new Error();$("#loginPanel").hidden=true;$("#dashboard").hidden=false;await loadOrders()}catch{$("#loginPanel").hidden=false;$("#dashboard").hidden=true}}
      async function loadOrders(){const target=$("#orders");target.innerHTML='<p class="empty">Загружаем...</p>';try{const {orders}=await request("/api/admin/orders");$("#orderCount").textContent=`${orders.length} заказов`;target.innerHTML=orders.length?orders.map(order=>`<article class="order"><div><h2>${escape(order.number)}</h2><p>${escape(order.customer.name)}, ${escape(order.customer.phone)}</p><p class="muted">${escape(order.customer.email)}</p></div><div><strong>${order.fulfillment==="delivery"?"Доставка":"Самовывоз"}</strong><p>${escape(order.address||order.pickupTime||"Время уточняется")}</p><p class="items">${order.items.map(item=>`${escape(item.name)}, ${item.weight} г × ${item.quantity}`).join("<br>")}</p></div><div><div class="money">${money.format(order.total)}</div><span class="badge">${order.paymentStatus==="paid"?"Оплачено":"Ожидает оплаты"}</span></div><select class="status-select" data-id="${escape(order.id)}" aria-label="Статус заказа ${escape(order.number)}">${Object.entries(labels).map(([value,label])=>`<option value="${value}" ${value===order.status?"selected":""}>${label}</option>`).join("")}</select></article>`).join(""):'<p class="empty">Новых заказов пока нет.</p>';target.querySelectorAll("select[data-id]").forEach(select=>select.addEventListener("change",async()=>{select.disabled=true;try{await request(`/api/admin/orders/${select.dataset.id}`,{method:"PATCH",body:JSON.stringify({status:select.value})})}catch(error){alert(error.message);await loadOrders()}finally{select.disabled=false}}))}catch(error){target.innerHTML=`<p class="empty">${escape(error.message)}</p>`}}
      $("#loginForm").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;const status=$("#loginStatus");status.textContent="";try{await request("/api/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();await check()}catch(error){status.textContent=error.message}});$("#refreshButton").addEventListener("click",loadOrders);$("#logoutButton").addEventListener("click",async()=>{await request("/api/auth/logout",{method:"POST",body:"{}"});await check()});check();
    })();
  </script>
</body>
</html>
